server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]   # 프로젝트 루트 .env 자동 읽기 (환경변수도 사용 가능)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/seoul_gacha?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:seoul}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  sql:
    init:
      mode: always
      encoding: UTF-8

springdoc:
  swagger-ui:
    path: /swagger-ui.html   # http://localhost:8080/swagger-ui.html
    tags-sorter: alpha      # 사용자 → 지역 → 장소 → 퀘스트 → 데모 순으로 표시

llm:
  mock: ${LLM_MOCK:true}                                # 키 없이도 동작. 실제 AI는 LLM_MOCK=false
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}   # OpenAI 호환 API면 변경 가능
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:15}            # 넘으면 기본 응답으로 대체 (데모 중 멈춤 방지)

game:
  initial-coins: 1          # 가입 시 최초 무료 코인 1개 지급
  gacha-cost: 1             # 가챠 1회 비용 (첫 지급 코인도 동일하게 사용)
  region-conquer-bonus: 2   # 지역 정복 보너스
  first-region-code: SEODAEMUN   # 첫 가챠는 무조건 서대문구 (데모 안정성). 비우면 완전 랜덤
